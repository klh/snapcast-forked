#  Snapserver config file                                                     #
#                                                                             #
###############################################################################

# default values are commented
# uncomment and edit to change them

# Settings can be overwritten on command line with:
#  "--<section>.<n>=<value>", e.g. --server.threads=4


# General server settings #####################################################
#
[server]
# Number of additional worker threads to use
# - For values < 0 the number of threads will be 2 (on single and dual cores)
#   or 4 (for quad and more cores)
# - 0 will utilize just the processes main thread and might cause audio drops
#   in case there are a couple of longer running tasks, such as encoding
#   multiple audio streams
#threads = -1

# the pid file when running as daemon (-d or --daemon)
#pidfile = /var/run/snapserver/pid

# the user to run as when daemonized (-d or --daemon)
#user = snapserver
# the group to run as when daemonized (-d or --daemon)
#group = snapserver

# directory where persistent data is stored (server.json)
# if empty, data dir will be
#  - "/var/lib/snapserver/" when running as daemon
#  - "$HOME/.config/snapserver/" when not running as daemon
#datadir =

#
###############################################################################


# Secure Socket Layer #########################################################
#
[ssl]
# enable SSL
#enabled = false

# path to PEM-encoded private key file
#cert = /etc/ssl/certs/ssl-cert-snakeoil.pem

# path to certificate file
#key = /etc/ssl/private/ssl-cert-snakeoil.key

# path to certificate authority file
#ca = /etc/ssl/certs/ca-certificates.crt

# verify client certificate
#verify_client = false

# path to certificate authority file for client verification
#client_ca = /etc/ssl/certs/ca-certificates.crt

#
###############################################################################


# HTTP RPC ####################################################################
#
[http]
# enable HTTP Json RPC (HTTP POST and websockets)
#enabled = true

# address to listen on, can be specified multiple times
# use "0.0.0.0" to bind to any IPv4 address or :: to bind to any IPv6 address
# or "127.0.0.1" or "::1" to bind to localhost IPv4 or IPv6, respectively
# use the address of a specific network interface to just listen to and accept
# connections from that interface
#bind_to_address = ::

# which port the server should listen to
#port = 1780

# serve a website from the doc_root location
# disabled if commented or empty
doc_root = /usr/share/snapserver/snapweb

# Hostname or IP under which clients can reach this host
# used to serve cached cover art
# use <hostname> as placeholder for your actual host name
#host = <hostname>

# Optional custom URL prefix for generated URLs where clients can reach
# cached album art, to e.g. match scheme behind a reverse proxy.
#url_prefix = https://<hostname>

#
###############################################################################


# TCP RPC #####################################################################
#
[tcp]
# enable TCP Json RPC
#enabled = true

# address to listen on, can be specified multiple times
# use "0.0.0.0" to bind to any IPv4 address or :: to bind to any IPv6 address
# or "127.0.0.1" or "::1" to bind to localhost IPv4 or IPv6, respectively
# use the address of a specific network interface to just listen to and accept
# connections from that interface
#bind_to_address = ::

# which port the server should listen to
#port = 1705
#
###############################################################################


# SRT Transport ###############################################################
#
[srt]
# enable SRT (Secure Reliable Transport) for audio streaming
#enabled = true

# address to listen on, can be specified multiple times
# use "0.0.0.0" to bind to any IPv4 address or :: to bind to any IPv6 address
# or "127.0.0.1" or "::1" to bind to localhost IPv4 or IPv6, respectively
# use the address of a specific network interface to just listen to and accept
# connections from that interface
#bind_to_address = ::

# which port the server should listen to
#port = 1706

# latency in milliseconds
# higher values provide better reliability on lossy networks
# but increase overall latency
#latency = 120

# enable encryption for SRT transport
#encryption = false

# encryption passphrase
# only used if encryption is enabled
#passphrase = 

# maximum bandwidth in bytes per second (0 = unlimited)
#max_bandwidth = 0
#
###############################################################################


# Stream settings #############################################################
#
[stream]
# address to listen on, can be specified multiple times
# use "0.0.0.0" to bind to any IPv4 address or :: to bind to any IPv6 address
# or "127.0.0.1" or "::1" to bind to localhost IPv4 or IPv6, respectively
# use the address of a specific network interface to just listen to and accept
# connections from that interface
#bind_to_address = ::

# which port the server should listen to
#port = 1704

# source URI of the PCM input stream, can be configured multiple times
# The following notation is used in this paragraph:
# <angle brackets>: the whole expression must be replaced with your specific setting
# [square brackets]: the whole expression is optional and can be left out
# [key=value]: if you leave this option out, "value" will be the default for "key"
#
# Format: TYPE://host/path?name=<name>[&codec=<codec>][&sampleformat=<sampleformat>][&chunk_ms=<chunk ms>]
#  parameters have the form "key=value", they are concatenated with an "&" character
#  parameter "name" is mandatory for all sources, while codec, sampleformat and chunk_ms are optional
#  and will override the default codec, sampleformat or chunk_ms settings
#
# Available types are:
#  pipe: pipe:///<path/to/pipe>?name=<name>[&mode=create][&dryout_ms=2000][&silence_threshold=0.0]
#   pipe is a named pipe (fifo) that the server reads PCM data from
#   type "man mkfifo" for details on how to create a fifo
#   mode=create: if given, the pipe will be created by the server
#   dryout_ms=2000: if no new data is read from the pipe, send silence for <dryout_ms> milliseconds
#                   and then close the stream until new data arrives
#   silence_threshold=0.0: if the input stream falls below this threshold (0.0 - 1.0), send silence
#
#  librespot: librespot:///<path/to/librespot>?name=<name>[&dryout_ms=2000][&username=<my username>&password=<my password>][&devicename=Snapcast][&bitrate=320][&wd_timeout=7800][&volume=100][&onevent=""][&normalize=false][&autoplay=false][&cache=""][&disable_audio_cache=false][&killall=false]
#   librespot is the headless spotify player
#   dryout_ms=2000: if no new data is read from the librespot, send silence for <dryout_ms> milliseconds
#                   and then close the stream until new data arrives
#   username=<my username>: spotify username
#   password=<my password>: spotify password
#   devicename=Snapcast: the name that shows up in the Spotify client
#   bitrate=320: spotify bitrate, valid values are 96, 160, 320
#   wd_timeout=7800: timeout in seconds after which librespot will be killed if inactive
#   volume=100: initial volume in percent
#   onevent="": path to a script that will be called when the playback state changes
#   normalize=false: normalize volume
#   autoplay=false: autoplay similar songs when your music ends
#   cache="": path to a cache directory
#   disable_audio_cache=false: disable caching of the audio data
#   killall=false: kill all running librespot instances
#
#  airplay: airplay:///<path/to/airplay>?name=<name>[&dryout_ms=2000][&port=5000][&devicename=Snapcast][&password=<my password>][&interpolation=basic][&on_song_changed=""][&wd_timeout=7800][&silence_threshold=0.0]
#   airplay is a headless airplay server
#   dryout_ms=2000: if no new data is read from the airplay, send silence for <dryout_ms> milliseconds
#                   and then close the stream until new data arrives
#   port=5000: port on which the airplay server listens
#   devicename=Snapcast: the name that shows up on your airplay device
#   password=<my password>: password for airplay
#   interpolation=basic: interpolation type basic|soxr
#   on_song_changed="": path to a script that will be called when the song changes
#   wd_timeout=7800: timeout in seconds after which airplay will be killed if inactive
#   silence_threshold=0.0: if the input stream falls below this threshold (0.0 - 1.0), send silence
#
#  file: file:///<path/to/PCM/file>?name=<name>
#   Read PCM data from a file
#
#  process: process:///<path/to/process>?name=<name>[&dryout_ms=2000][&wd_timeout=0][&log_stderr=false][&params=<process arguments>][&silence_threshold=0.0]
#   Launches a process and reads PCM data from stdout
#   dryout_ms=2000: if no new data is read from stdout, send silence for <dryout_ms> milliseconds
#                   and then close the stream until new data arrives
#   wd_timeout=0: kill process if no data is received for <wd_timeout> seconds. 0 means disabled
#   log_stderr=false: if true, stderr output of the process will be logged with loglevel warning
#   params=<process arguments>: can be used to pass arguments to the process
#   silence_threshold=0.0: if the input stream falls below this threshold (0.0 - 1.0), send silence
#
#  tcp server: tcp://<listen IP, e.g. 127.0.0.1>:<port>?name=<name>[&mode=server]
#   Listen on a TCP socket for PCM data
#
#  tcp client: tcp://<server IP, e.g. 127.0.0.1>:<port>?name=<name>&mode=client
#   Connect to a TCP server to read PCM data
#
#  alsa: alsa://?name=<name>&device=<alsa device>[&send_silence=false][&idle_threshold=100][&silence_threshold_percent=0.0]
#   Captures audio from an alsa device
#   device=<alsa device>: alsa device name, e.g. "hw:0,0"
#   send_silence=false: send silence if there is no audio
#   idle_threshold=100: idle threshold in percent
#   silence_threshold_percent=0.0: if the captured stream falls below this threshold (0.0 - 100.0), send silence
#
#  meta: meta:///<name of source#1>/<name of source#2>/.../<name of source#N>?name=<name>
#   Meta source, plays the first available source
#
# Available codecs are:
#  pcm: PCM
#   PCM data, no codec
#  flac: FLAC
#   FLAC compression
#  opus: Opus
#   Opus compression
#
# Available sample formats are:
#  <sample rate>:<bits per sample>:<channels>
#  e.g. 48000:16:2 for 48kHz, 16 bit, stereo
#
#source = pipe:///tmp/snapfifo?name=default
#source = tcp://127.0.0.1:4953?name=mopidy_tcp

# Default sample format
#sampleformat = 48000:16:2

# Default transport codec
# (flac|opus|pcm)[:options]
# Type codec:? to get codec specific options
#codec = flac

# Default stream read chunk size [ms]
#chunk_ms = 20

# Buffer [ms]
#buffer = 1000

# Send audio to muted clients
#send_to_muted = false

#
###############################################################################


# Streaming client options ####################################################
#
[streaming_client]
#
# Initial client volume in percent:
# 0-100
#initial_volume = 100

#
###############################################################################


# Logging options #############################################################
#
[logging]

# log sink [null,system,stdout,stderr,file:<filename>]
# when left empty: if running as daemon "system" else "stdout"
#sink =

# log filter <tag>:<level>[,<tag>:<level>]* where tag can be "*" for "all tags"
# where level is [trace,debug,info,notice,warning,error,fatal]
#filter = *:info
